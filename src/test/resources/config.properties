
# While creating the Docker image, uncomment the Docker base URL
# and comment out the local system base URL

# Base URL for the local system
baseurl=http://localhost:3000

# Base URL for the Docker image 
#baseurl=http://host.docker.internal:3000

#Dynamic reports yes or no
# is yes, reports will have name as currenttime+index.html
#if no , reports will be names as index.html
overridereports=yes

#Open the Extent report automatically once the execution completes-->yes or no
openextentreportautomaticallyafterexecutioncompletes=false